name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Pinned: `ubuntu-latest` is migrating to 26.04, which GitHub flags on every run.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # The key otherwise ignores the matrix, so both jobs race to save one entry.
          cache-suffix: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        # The real IHDS-II file cannot be redistributed; the suite builds a
        # synthetic DS0002 in tests/conftest.py.
        run: uv run pytest
      - name: End-to-end demo
        # Runs build -> features -> grouped CV -> targeting -> outreach on the
        # synthetic survey, so a broken pipeline fails CI without the ICPSR file.
        run: uv run sgc demo --out demo_out
