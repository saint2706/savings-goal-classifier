[project]
name = "savings-goal"
version = "0.2.0"
description = "Leakage-free prediction of household savings adequacy on IHDS-II (ICPSR 36151)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.2.6,<3",
    "pandas>=2.2.3,<3",
    "polars>=1.20,<2",
    "pyarrow>=18",
    "pandera[polars,pandas]>=0.22,<1",
    "scipy>=1.14.1,<2",
    "scikit-learn>=1.7.2,<2",
    "xgboost>=3.1.1,<4",
    "shap>=0.50,<1",
    "statsmodels>=0.14.4,<1",
    "matplotlib>=3.10.0,<4",
    "seaborn>=0.13.2,<1",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.32"]

[project.scripts]
sgc = "savings_goal.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "httpx2",
    "fastapi>=0.115",
    "jupyter-core>=5.7",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/savings_goal"]

[tool.uv]
# Without an explicit environment list uv resolves for every platform, and
# shap -> numba -> llvmlite then falls back to an sdist that cannot be built.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "project"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
ignore = ["E501"]

[tool.mypy]
files = ["src/savings_goal"]
python_version = "3.11"
strict = true
ignore_missing_imports = true
# sklearn / xgboost / shap ship no stubs; their objects are Any to mypy.
disallow_any_generics = false
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=savings_goal --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::PendingDeprecationWarning:shap.*",
]
